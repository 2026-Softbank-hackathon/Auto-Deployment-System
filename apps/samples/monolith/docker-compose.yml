services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_MESSAGE: "Hello from docker compose"
      DEPLOY_TARGET: "Docker Compose (local)"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
