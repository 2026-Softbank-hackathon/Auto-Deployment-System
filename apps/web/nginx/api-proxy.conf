# /api/ · /docs 공통 프록시 설정 (default.conf.template 에서 include)
proxy_pass http://camellia_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $camellia_forwarded_proto;

# 브라우저(fetch · EventSource)는 API Key 헤더를 붙이지 않는다 → Basic Auth 를 통과한
# 요청에만 플랫폼 API Key 를 주입한다. Bearer 요청(Agent · CLI)은 값이 비어 헤더가 빠지고
# API 가 Bearer 를 직접 검증한다.
proxy_set_header X-API-Key $camellia_injected_api_key;
proxy_set_header Authorization $camellia_upstream_authorization;

# SSE(/api/v1/deployments/:id/events, 30초 heartbeat) · Agent job long-poll:
# 응답 버퍼링을 끄고 타임아웃을 길게 잡는다.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;

# 소스 ZIP 업로드(최대 100MB)는 디스크 버퍼 없이 바로 API 로 흘려보낸다.
proxy_request_buffering off;
