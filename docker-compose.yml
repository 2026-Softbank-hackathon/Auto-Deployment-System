services:
  postgres:
    image: postgres:16-alpine
    container_name: camellia-postgres
    environment:
      POSTGRES_USER: camellia
      POSTGRES_PASSWORD: camellia
      POSTGRES_DB: camellia
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - camellia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camellia -d camellia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  camellia-postgres-data:
