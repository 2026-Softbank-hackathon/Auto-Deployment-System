$ir_version: "0.1.0"
metadata:
  name: with-postgres-app
  version: "1.0.0"
  description: "HTTP 서비스 + postgres 리소스"
services:
  api:
    type: http
    port: 3000
    size: small
    expose: public
resources:
  db:
    type: postgres
    version: "16"
    plan: dev
deploy:
  profile: aws-ecs-basic
